[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "action-flow-consistency"
version = "0.1.0"
description = "Action-Flow Consistency Across Views: anonymous ICRA submission code"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = "Apache-2.0"
dependencies = [
  "augmax==0.4.1", "beartype==0.19.0", "einops>=0.8.0", "etils[epath]>=1.9.0",
  "flax==0.10.2", "jax==0.7.2", "jaxtyping==0.2.36", "numpy==2.4.4",
  "optax==0.2.8", "orbax-checkpoint==0.11.33", "tensorstore==0.1.74",
  "ml-dtypes==0.5.3", "torch==2.9.1+cpu", "torchvision==0.24.1+cpu", "lerobot",
  "pillow>=11", "opencv-python>=4.10", "sentencepiece>=0.2", "safetensors>=0.5",
  "fsspec[gcs]>=2024.6", "numpydantic>=1.6.6", "pydantic==2.13.0", "h5py>=3.13", "datasets==4.8.4", "huggingface-hub==0.36.2", "transformers==4.48.1", "av==17.0.0",
  "tqdm>=4.67", "tqdm-loggable>=0.2", "tyro==1.0.12", "wandb>=0.19.1",
  "websockets==16.0", "msgpack>=1.0.5", "scipy>=1.14", "pyyaml>=6", "imageio>=2.36",
  "typing-extensions>=4.12", "ml-collections>=1.0", "treescope>=0.1.7", "rich>=14",
]
[project.optional-dependencies]
cuda = ["jax[cuda13]==0.7.2"]
sim = ["robosuite==1.4.0", "mujoco==3.6.0", "bddl==1.0.1", "gym==0.25.2", "easydict>=1.9", "robomimic==0.2.0", "hydra-core>=1.3", "thop>=0.1.1", "future>=0.18", "matplotlib>=3.10", "scikit-image>=0.25"]
[dependency-groups]
dev = ["ruff>=0.8.6"]
[tool.uv.sources]
lerobot = { git = "https://github.com/huggingface/lerobot", rev = "0cf864870cf29f4738d3ade893e6fd13fbd7cdb5" }
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
[tool.setuptools.packages.find]
where = ["src"]
[tool.ruff]
line-length = 120
target-version = "py311"
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["F722"]
