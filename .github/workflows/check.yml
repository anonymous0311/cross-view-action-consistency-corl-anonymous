name: Code checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      JAX_PLATFORMS: cpu
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.10.10'
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run --frozen ruff check src scripts tests
      - run: uv run --frozen python -m unittest discover -s tests -v
      - run: uv build
